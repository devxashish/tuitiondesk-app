<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TuitionDesk - Instant UPI Payment & Fee Receipt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pure client-side QR generator (zero third-party API dependencies) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700/80 rounded-3xl p-6 shadow-2xl space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-teal-600/20 border border-teal-500/30 rounded-2xl mb-1 shadow-inner">
        <svg class="w-8 h-8 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
      </div>
      <h1 id="dispInstitute" class="text-xl font-extrabold text-white">TuitionDesk Coaching</h1>
      <p id="dispSubtitle" class="text-xs text-slate-400">Official Fee Payment Portal</p>
    </div>

    <!-- Student & Fee Card -->
    <div class="bg-slate-900/80 border border-slate-700/60 rounded-2xl p-4 flex items-center justify-between">
      <div>
        <div class="text-[11px] text-slate-400">Student Fee Summary</div>
        <div id="dispStudent" class="text-sm font-bold text-slate-200">Student Name</div>
        <div id="dispBatch" class="text-[10px] text-teal-400 font-medium">Batch Class</div>
      </div>
      <div class="text-right">
        <div class="text-[10px] text-slate-400 uppercase font-semibold">Amount Due</div>
        <div id="dispAmount" class="text-2xl font-black text-emerald-400">₹0</div>
      </div>
    </div>

    <!-- QR Code Container (Generated 100% on device canvas) -->
    <div class="bg-white rounded-2xl p-5 shadow-lg flex flex-col items-center justify-center space-y-3">
      <div id="qrcode" class="flex justify-center"></div>
      <div class="text-center">
        <div class="text-[11px] font-bold text-slate-800">Scan with any UPI App</div>
        <div class="text-[10px] text-slate-500">Google Pay • PhonePe • Paytm • BHIM • CRED</div>
      </div>
    </div>

    <!-- 1-Tap Pay Direct App Buttons -->
    <div class="space-y-2">
      <a id="btnGpay" href="#" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl text-sm shadow-lg transition active:scale-[0.98]">
        <span>⚡ 1-Tap Pay via GPay / PhonePe / Paytm</span>
      </a>
      <div class="text-center text-[11px] text-slate-400">
        Direct UPI ID: <span id="dispUpiId" class="font-mono font-bold text-teal-300">upi@bank</span>
      </div>
    </div>

    <!-- Security Badge -->
    <div class="border-t border-slate-700/60 pt-4 flex items-center justify-center gap-1.5 text-[10px] text-slate-400">
      <svg class="w-3.5 h-3.5 text-emerald-400" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd"></path>
      </svg>
      <span>Zero Commission • Direct to Teacher Bank Account</span>
    </div>
  </div>

  <script>
    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const pa = params.get('pa') || 'tuitiondesk@okicici';
    const pn = params.get('pn') || 'TuitionDesk Coaching';
    const am = params.get('am') || '0';
    const name = params.get('name') || 'Student';
    const batch = params.get('batch') || 'Coaching Batch';

    // Populate UI
    document.getElementById('dispInstitute').textContent = pn;
    document.getElementById('dispStudent').textContent = name;
    document.getElementById('dispBatch').textContent = batch;
    document.getElementById('dispAmount').textContent = '₹' + Number(am).toLocaleString('en-IN');
    document.getElementById('dispUpiId').textContent = pa;

    // Construct standard NPCI UPI Intent Link
    const cleanName = name.replace(/\s+/g, '_');
    const upiLink = `upi://pay?pa=${encodeURIComponent(pa)}&pn=${encodeURIComponent(pn)}&am=${encodeURIComponent(am)}&tn=Fee_${cleanName}&cu=INR`;
    document.getElementById('btnGpay').href = upiLink;

    // Generate local QR Code with QRCode.js (100% Client-side, 0 External Server Calls)
    new QRCode(document.getElementById("qrcode"), {
      text: upiLink,
      width: 200,
      height: 200,
      colorDark : "#0F172A",
      colorLight : "#FFFFFF",
      correctLevel : QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
